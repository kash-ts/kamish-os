name: Kamish Firmware Build

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "database/**"
      - "firmware/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-firmware.yml"
  pull_request:
    paths:
      - "crates/**"
      - "database/**"
      - "firmware/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-firmware.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu pkg-config libasound2-dev

      - name: Install Rust toolchain and target
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-unknown-linux-gnu
          components: rustfmt
          cache: true

      - name: Install frontend dependencies
        working-directory: crates/kamish-web/frontend
        run: npm ci

      - name: Build frontend
        working-directory: crates/kamish-web/frontend
        run: npm run build

      - name: Check, test, and format
        run: |
          cargo check --workspace --all-targets
          cargo test --workspace
          cargo fmt --all -- --check

      - name: Cross-compile release binaries
        env:
          CARGO_BUILD_TARGET: aarch64-unknown-linux-gnu
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --workspace

      - name: Verify release artifacts
        run: |
          test -x target/aarch64-unknown-linux-gnu/release/kamish-core
          test -x target/aarch64-unknown-linux-gnu/release/kamish-web
          file target/aarch64-unknown-linux-gnu/release/kamish-core target/aarch64-unknown-linux-gnu/release/kamish-web

      - name: Buildroot configuration smoke check
        run: |
          test -f firmware/buildroot-external-kamish/external.desc
          test -f firmware/buildroot-external-kamish/package/kamish/kamish.mk
          test -f firmware/buildroot-external-kamish/board/kamish/orangepi-4-pro/users.table
          test -f firmware/buildroot-external-kamish/board/kamish/orangepi-4-pro/overlay/etc/fstab
          test -f firmware/buildroot-external-kamish/board/kamish/orangepi-4-pro/overlay/etc/rauc/system.conf
          test -f firmware/buildroot-external-kamish/board/kamish/orangepi-4-pro/overlay/etc/systemd/system/kamish-core.service
          test -f firmware/buildroot-external-kamish/board/kamish/orangepi-4-pro/overlay/etc/systemd/system/kamish-web.service
          test -f firmware/buildroot-external-kamish/board/kamish/orangepi-4-pro/overlay/etc/systemd/system/kamish-mounts.service
          test -f scripts/repack-image.sh
          test -f scripts/verify-image.sh
          bash -n scripts/repack-image.sh
          bash -n scripts/verify-image.sh
          bash -n firmware/scripts/gen-keys.sh
          bash -n firmware/scripts/build-bundle.sh
          bash -n firmware/buildroot-external-kamish/board/kamish/orangepi-4-pro/post-image.sh
