name: Build Kamish OS firmware

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "crates/**"
      - "database/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/build-firmware.yml"
  workflow_dispatch:
    inputs:
      skip_cross_build:
        description: "Skip aarch64 cross compilation (use pre-built binaries)"
        required: false
        default: "false"
        type: boolean

jobs:
  build:
    runs-on: ubuntu-24.04
    concurrency:
      group: firmware-${{ github.ref }}
      cancel-in-progress: true
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Cache the directory actually bind-mounted at /build/buildroot. Each run
      # saves a new immutable snapshot; only the same firmware configuration is restored.
      - name: Restore Buildroot output
        id: buildroot-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            firmware/buildroot-2024.02.1.tar.gz
            buildroot-cache
          key: ${{ runner.os }}-buildroot-2024.02.1-v2-${{ hashFiles('firmware/buildroot-external-kamish/**', 'firmware/docker-compose.yml', 'firmware/Dockerfile') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-buildroot-2024.02.1-v2-${{ hashFiles('firmware/buildroot-external-kamish/**', 'firmware/docker-compose.yml', 'firmware/Dockerfile') }}-

      - name: Fetch Buildroot tarball
        run: bash scripts/fetch-buildroot.sh

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-unknown-linux-gnu

      - name: Install cross-compile dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libssl-dev libsqlite3-dev pkg-config
          sudo dpkg --add-architecture arm64
          . /etc/os-release
          printf 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports %s main universe\ndeb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports %s-updates main universe\ndeb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports %s-security main universe\n' "$VERSION_CODENAME" "$VERSION_CODENAME" "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/kamish-arm64.list > /dev/null
          sudo apt-get update -o Dir::Etc::sourcelist="sources.list.d/kamish-arm64.list" -o Dir::Etc::sourceparts="-"
          mkdir -p "$RUNNER_TEMP/kamish-arm64-openssl"
          cd "$RUNNER_TEMP/kamish-arm64-openssl"
          apt-get download libssl-dev:arm64 libssl3t64:arm64
          for package in ./*.deb; do dpkg-deb -x "$package" sysroot; done

      - name: Cargo check (workspace)
        run: cargo check --workspace --all-targets

      - name: Cargo test (workspace)
        run: cargo test --workspace

      - name: Cargo fmt check
        run: cargo fmt --all -- --check

      - name: Cross-build aarch64 binaries
        if: ${{ !inputs.skip_cross_build }}
        env:
          AARCH64_UNKNOWN_LINUX_GNU_OPENSSL_LIB_DIR: ${{ runner.temp }}/kamish-arm64-openssl/sysroot/usr/lib/aarch64-linux-gnu
          AARCH64_UNKNOWN_LINUX_GNU_OPENSSL_INCLUDE_DIR: ${{ runner.temp }}/kamish-arm64-openssl/sysroot/usr/include
          CFLAGS_aarch64_unknown_linux_gnu: -I${{ runner.temp }}/kamish-arm64-openssl/sysroot/usr/include/aarch64-linux-gnu
        run: ./scripts/cross-build-kamish.sh

      - name: Build firmware via Docker Compose
        working-directory: firmware
        env:
          KAMISH_BR_DIR: ${{ github.workspace }}/buildroot-cache
        run: |
          mkdir -p ${{ github.workspace }}/buildroot-cache
          sudo chown -R 1000:1000 ${{ github.workspace }}/buildroot-cache
          docker compose build builder
          docker compose run --rm builder

      - name: Save Buildroot output
        if: ${{ success() && steps.buildroot-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            firmware/buildroot-2024.02.1.tar.gz
            buildroot-cache
          key: ${{ steps.buildroot-cache.outputs.cache-primary-key }}

      - name: Upload firmware image artifact
        uses: actions/upload-artifact@v4
        with:
          name: kamish-firmware
          path: firmware/output/images/*.img
          if-no-files-found: error
          retention-days: 14
