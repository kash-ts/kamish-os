name: Build Kamish OS firmware

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "crates/**"
      - "database/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/build-firmware.yml"
  workflow_dispatch:
    inputs:
      skip_cross_build:
        description: "Skip aarch64 cross compilation (use pre-built binaries)"
        required: false
        default: "false"
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: firmware-${{ github.ref }}
      cancel-in-progress: true
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Buildroot source and output
        uses: actions/cache@v4
        with:
          path: |
            firmware/buildroot-2024.02.1.tar.gz
            firmware/buildroot
          key: ${{ runner.os }}-buildroot-2024.02.1-${{ hashFiles('firmware/buildroot-external-kamish/**/*.mk', 'firmware/docker-compose.yml', 'firmware/Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-buildroot-2024.02.1-

      - name: Fetch Buildroot tarball
        run: bash scripts/fetch-buildroot.sh

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-unknown-linux-gnu

      - name: Install cross-compile dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libssl-dev libsqlite3-dev pkg-config
          sudo dpkg --add-architecture arm64
          . /etc/os-release
          printf 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports %s main universe\ndeb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports %s-updates main universe\ndeb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports %s-security main universe\n' "$VERSION_CODENAME" "$VERSION_CODENAME" "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/kamish-arm64.list > /dev/null
          sudo apt-get update -o Dir::Etc::sourcelist="sources.list.d/kamish-arm64.list" -o Dir::Etc::sourceparts="-"
          sudo apt-get install -y libssl-dev:arm64

      - name: Cargo check (workspace)
        run: cargo check --workspace --all-targets

      - name: Cargo test (workspace)
        run: cargo test --workspace

      - name: Cargo fmt check
        run: cargo fmt --all -- --check

      - name: Cross-build aarch64 binaries
        if: ${{ !inputs.skip_cross_build }}
        env:
          AARCH64_UNKNOWN_LINUX_GNU_OPENSSL_LIB_DIR: /usr/lib/aarch64-linux-gnu
          AARCH64_UNKNOWN_LINUX_GNU_OPENSSL_INCLUDE_DIR: /usr/include
        run: ./scripts/cross-build-kamish.sh

      - name: Build firmware via Docker Compose
        working-directory: firmware
        env:
          KAMISH_BR_DIR: ${{ github.workspace }}/buildroot-cache
        run: |
          mkdir -p ${{ github.workspace }}/buildroot-cache
          docker compose build builder
          docker compose run --rm builder

      - name: Upload firmware image artifact
        uses: actions/upload-artifact@v4
        with:
          name: kamish-firmware
          path: firmware/output/images/*.img
          if-no-files-found: error
          retention-days: 14
