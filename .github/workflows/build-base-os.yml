name: Build Kamish Base OS (Buildroot)

on:
  workflow_call:
    inputs:
      force_rebuild:
        description: "Bypass Buildroot ccache and rebuild cleanly"
        required: false
        type: boolean
        default: false
    outputs:
      artifact_name:
        description: "Uploaded Base OS artifact name"
        value: ${{ jobs.build-base-os.outputs.artifact_name }}
      run_id:
        description: "Workflow run ID that produced the Base OS artifact"
        value: ${{ jobs.build-base-os.outputs.run_id }}
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Bypass Buildroot ccache and rebuild cleanly"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 3 1 */2 *"

permissions:
  contents: read

concurrency:
  group: build-base-os-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-base-os:
    name: Build Buildroot Base OS (Orange Pi 4 Pro)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      artifact_name: ${{ steps.pack.outputs.artifact_name }}
      run_id: ${{ github.run_id }}

    steps:
      - name: Free disk space on runner
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune -a --force || true
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache Buildroot tarball
        id: br-tarball-cache
        uses: actions/cache@v4
        with:
          path: firmware/buildroot-2024.02.1.tar.gz
          key: buildroot-tarball-2024.02.1

      - name: Fetch Buildroot tarball
        if: steps.br-tarball-cache.outputs.cache-hit != 'true'
        run: bash scripts/fetch-buildroot.sh firmware/buildroot-2024.02.1.tar.gz

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Buildroot container image
        uses: docker/build-push-action@v6
        with:
          context: firmware
          file: firmware/Dockerfile
          load: true
          tags: kamish-br-builder:local
          cache-from: type=gha,scope=br-docker
          cache-to: type=gha,mode=max,scope=br-docker

      - name: Cache Buildroot downloads (dl)
        uses: actions/cache@v4
        with:
          path: buildroot-cache/dl
          key: br-dl-v1-${{ hashFiles('firmware/buildroot-external-kamish/configs/**') }}
          restore-keys: |
            br-dl-v1-

      - name: Cache Buildroot ccache
        if: ${{ !inputs.force_rebuild }}
        uses: actions/cache@v4
        with:
          path: buildroot-cache/ccache
          key: br-ccache-v1-${{ hashFiles('firmware/buildroot-external-kamish/configs/**', 'firmware/buildroot-external-kamish/board/kamish/orangepi-4-pro/linux.fragment') }}-${{ github.run_id }}
          restore-keys: |
            br-ccache-v1-${{ hashFiles('firmware/buildroot-external-kamish/configs/**', 'firmware/buildroot-external-kamish/board/kamish/orangepi-4-pro/linux.fragment') }}-
            br-ccache-v1-

      - name: Build Base OS with Buildroot (Docker)
        working-directory: firmware
        env:
          KAMISH_BR_DIR: ${{ github.workspace }}/buildroot-cache
          KAMISH_BASE_ONLY: "1"
        run: |
          mkdir -p "${{ github.workspace }}/buildroot-cache/dl"
          mkdir -p "${{ github.workspace }}/buildroot-cache/ccache"
          sudo chown -R 1000:1000 "${{ github.workspace }}/buildroot-cache"
          docker compose run --rm builder

      - name: Fix permissions on buildroot output
        if: always()
        run: sudo chown -R $(id -u):$(id -g) buildroot-cache || true

      - name: Print failure log tail
        if: failure()
        run: |
          if [ -f buildroot-cache/build.log ]; then
            echo "=== Last 200 lines of build.log ==="
            tail -n 200 buildroot-cache/build.log
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildroot-base-failure-log
          path: buildroot-cache/build.log
          if-no-files-found: ignore

      - name: Pack Base OS artifact
        id: pack
        run: |
          set -euo pipefail
          IMG_OUT="buildroot-cache/output/images"
          test -s "${IMG_OUT}/rootfs.tar.gz"
          test -s "${IMG_OUT}/boot0_sdcard.fex"
          test -s "${IMG_OUT}/boot_package.fex"
          test -s "${IMG_OUT}/boot.scr"

          rm -rf base-os-artifact
          mkdir -p base-os-artifact

          echo "Recompressing rootfs.tar.gz -> rootfs-base.tar.zst..."
          command -v zstd >/dev/null || (sudo apt-get update && sudo apt-get install -y --no-install-recommends zstd)
          gzip -dc "${IMG_OUT}/rootfs.tar.gz" | zstd -T0 -9 -o base-os-artifact/rootfs-base.tar.zst
          cp "${IMG_OUT}/boot0_sdcard.fex" base-os-artifact/
          cp "${IMG_OUT}/boot_package.fex" base-os-artifact/
          cp "${IMG_OUT}/boot.scr" base-os-artifact/

          BASE_OS_HASH="$(
            find \
              firmware/Dockerfile \
              firmware/docker-compose.yml \
              firmware/buildroot-external-kamish/configs \
              firmware/buildroot-external-kamish/board/kamish/orangepi-4-pro/linux.fragment \
              firmware/buildroot-external-kamish/board/kamish/orangepi-4-pro/bootloader \
              firmware/buildroot-external-kamish/board/kamish/orangepi-4-pro/users.table \
              scripts/fetch-buildroot.sh \
              -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -c1-12
          )"
          ARTIFACT_NAME="kamish-base-os-${BASE_OS_HASH}"
          echo "Base OS input hash: ${BASE_OS_HASH} -> ${ARTIFACT_NAME}"

          DEFCONFIG_SHA="$(sha256sum firmware/buildroot-external-kamish/configs/kamish_orangepi_4_pro_defconfig | cut -d' ' -f1)"
          python3 - "${GITHUB_SHA}" "${GITHUB_RUN_ID}" "${DEFCONFIG_SHA}" "${BASE_OS_HASH}" <<'PYEOF'
          import datetime, json, sys
          manifest = {
              "git_sha": sys.argv[1],
              "run_id": sys.argv[2],
              "buildroot_version": "2024.02.1",
              "built_at_utc": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "defconfig_sha256": sys.argv[3],
              "base_os_hash": sys.argv[4],
          }
          with open("base-os-artifact/base-os-manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PYEOF

          (cd base-os-artifact && sha256sum rootfs-base.tar.zst boot0_sdcard.fex boot_package.fex boot.scr base-os-manifest.json > SHA256SUMS)
          ls -lh base-os-artifact
          echo "artifact_name=${ARTIFACT_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Upload Base OS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.artifact_name }}
          path: base-os-artifact/
          retention-days: 90
