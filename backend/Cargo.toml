[package]
name = "kamish-backend"
version = "0.1.0"
edition = "2021"
authors = ["Kamish Team"]
description = "Metapackage bridging kamish-core, kamish-web, and kamish-ipc"

[lib]
name = "kamish_backend"
path = "src/lib.rs"

[dependencies]
kamish-core = { path = "../crates/kamish-core" }
kamish-web = { path = "../crates/kamish-web" }
kamish-ipc = { path = "../crates/kamish-ipc" }
