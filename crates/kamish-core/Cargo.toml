[package]
name = "kamish-core"
version = "0.1.0"
edition = "2021"
authors = ["Kamish Team"]
description = "Core software daemon for Kamish OS"

[lib]
name = "kamish_core"
path = "src/lib.rs"

[[bin]]
name = "kamish-core"
path = "src/main.rs"

[dependencies]
kamish-ipc = { path = "../kamish-ipc" }
tokio = { version = "1.41", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sysinfo = "0.33"
anyhow = "1.0"
thiserror = "2.0"
dotenvy = "0.15"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
chrono-tz = "0.10.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1.41", features = ["full", "test-util"] }
tempfile = "3"
