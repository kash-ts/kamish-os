[package]
name = "kamish-ipc"
version = "0.1.0"
edition = "2021"
authors = ["Kamish Team"]
description = "Inter-process communication protocol between kamish-core and kamish-web"

[dependencies]
tokio = { version = "1.41", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
