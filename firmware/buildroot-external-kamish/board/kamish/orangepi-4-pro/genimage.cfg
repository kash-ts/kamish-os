image boot.vfat {
	vfat {
		extraargs = "-F 16 -n BOOT"
		files = {
			"boot.scr"
		}
	}
	size = 32M
}

image kamish-sdcard.img {
	hdimage {
		partition-table-type = "mbr"
	}

	partition u-boot {
		in-partition-table = "no"
		image = "u-boot.bin"
		offset = 8K
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
		offset = 1M
	}

	partition system_a {
		partition-type = 0x83
		image = "rootfs.ext4"
		size = 1024M
	}

	partition system_b {
		partition-type = 0x83
		image = "rootfs.ext4"
		size = 1024M
	}

	partition data {
		partition-type = 0x83
		size = 2048M
	}
}
