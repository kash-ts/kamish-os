image boot.vfat {
	vfat {
		extraargs = "-F 16 -n BOOT"
		files = {
			"boot.scr"
		}
	}
	size = 32M
}

image kamish-sdcard.img {
	hdimage {
		partition-table-type = "mbr"
		disk-signature = 0x4b414d53
	}

	partition boot0 {
		in-partition-table = "no"
		image = "boot0_sdcard.fex"
		offset = 8K
	}

	partition boot_package {
		in-partition-table = "no"
		image = "boot_package.fex"
		offset = 16400K
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
		offset = 32M
	}

	partition system_a {
		partition-type = 0x83
		image = "rootfs.ext4"
		size = 1024M
	}

	partition system_b {
		partition-type = 0x83
		size = 1024M
	}

	partition data {
		partition-type = 0x83
		image = "data.ext4"
		size = 2048M
	}
}
